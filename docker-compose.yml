version: '3.8'

services:
  db:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reviews_app_development
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:8.10.1
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data: